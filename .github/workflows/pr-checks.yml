name: PR Checks

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
      has_code_changes: ${{ steps.filter.outputs.code }}
      has_infra_changes: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            infra:
              - 'infrastructure/**'
              - 'helm/**'
              - '.github/workflows/**'

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_code_changes == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_code_changes == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm turbo prisma:generate

      - name: Run type checking
        run: pnpm turbo build

  affected-tests:
    name: Affected Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_code_changes == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm turbo prisma:generate

      - name: Run database migrations
        run: pnpm turbo prisma:migrate

      - name: Run affected tests
        run: pnpm turbo test --filter='...[origin/main]'

  infra-validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_infra_changes == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          echo "Validating ArgoCD manifests..."
          for f in infrastructure/argocd/**/*.yaml; do
            echo "  Checking: $f"
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
          done
          echo "All YAML files are valid."

      - name: Validate GitHub Actions workflows
        run: |
          echo "Validating workflow files..."
          for f in .github/workflows/*.yml; do
            echo "  Checking: $f"
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
          done
          echo "All workflow files are valid."

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [format-check, type-check, affected-tests]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Generate PR check summary
        run: |
          echo "## PR Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format | ${{ needs.format-check.result == 'success' && '✅' || needs.format-check.result == 'skipped' && '⏭️' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type Check | ${{ needs.type-check.result == 'success' && '✅' || needs.type-check.result == 'skipped' && '⏭️' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Affected Tests | ${{ needs.affected-tests.result == 'success' && '✅' || needs.affected-tests.result == 'skipped' && '⏭️' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
