name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      service:
        description: Service to deploy
        required: true
        type: choice
        options:
          - all
          - identity
          - organization
          - project
          - pipeline
          - ai
          - notification
          - test-runner
          - dashboard
      image_tag:
        description: Docker image tag to deploy (defaults to latest main SHA)
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.tag }}
      services: ${{ steps.resolve-services.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag
        id: resolve-tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git rev-parse --short HEAD)
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve services
        id: resolve-services
        run: |
          if [ "${{ inputs.service }}" = "all" ]; then
            echo 'services=["identity","organization","project","pipeline","ai","notification","test-runner","dashboard"]' >> "$GITHUB_OUTPUT"
          else
            echo 'services=["${{ inputs.service }}"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Production deployment guard
        if: inputs.environment == 'production'
        run: |
          echo "::warning::Deploying to PRODUCTION environment"
          echo "Image tag: ${{ steps.resolve-tag.outputs.tag }}"
          echo "Services: ${{ steps.resolve-services.outputs.services }}"

  deploy:
    name: Deploy ${{ matrix.service }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.validate.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Helm values with new image tag
        run: |
          VALUES_FILE="helm/values/${{ inputs.environment }}.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "::error::Values file not found: ${VALUES_FILE}"
            exit 1
          fi

          # Update the image tag for the target service
          sed -i "s|tag:.*# ${{ matrix.service }}|tag: ${{ needs.validate.outputs.image_tag }} # ${{ matrix.service }}|g" "$VALUES_FILE"

          # If no service-specific comment found, update global image tag
          if ! grep -q "# ${{ matrix.service }}" "$VALUES_FILE"; then
            echo "::notice::No service-specific tag found, creating override section"
            cat >> "$VALUES_FILE" <<EOF

          # Auto-updated by CI/CD pipeline
          ${{ matrix.service }}:
            image:
              tag: ${{ needs.validate.outputs.image_tag }}
          EOF
          fi

      - name: Commit and push changes
        run: |
          git add helm/values/${{ inputs.environment }}.yaml
          git commit -m "deploy(${{ inputs.environment }}): ${{ matrix.service }}@${{ needs.validate.outputs.image_tag }}

          Triggered by: ${{ github.actor }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}

      - name: Wait for ArgoCD sync
        run: |
          echo "Helm values updated. ArgoCD will detect the change and sync automatically."
          echo ""
          echo "Service:     ${{ matrix.service }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Image tag:   ${{ needs.validate.outputs.image_tag }}"
          echo ""
          echo "Monitor the deployment in ArgoCD dashboard or run:"
          echo "  argocd app get testing-ai-${{ matrix.service }}"

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ inputs.environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | \`${{ inputs.service }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | \`${{ needs.validate.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ needs.deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
