## Staging environment values
global:
  imageRegistry: "registry.example.com/"
  imagePullSecrets:
    - name: registry-credentials
  domain: staging.testing-ai.example.com
  environment: staging

identity:
  enabled: true
  replicaCount: 2
  image:
    tag: "staging"
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
  ingress:
    enabled: true
    className: nginx
    host: identity.staging.testing-ai.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging

