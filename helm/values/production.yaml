## Production environment values
global:
  imageRegistry: "registry.example.com/"
  imagePullSecrets:
    - name: registry-credentials
  domain: testing-ai.example.com
  environment: production

identity:
  enabled: true
  replicaCount: 3
  image:
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  ingress:
    enabled: true
    className: nginx
    host: identity.testing-ai.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "100"
    tls:
      - secretName: identity-tls
        hosts:
          - identity.testing-ai.example.com
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - identity
            topologyKey: kubernetes.io/hostname

