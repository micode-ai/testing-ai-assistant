## Dev environment values
global:
  imageRegistry: ""
  imagePullSecrets: []
  domain: dev.testing-ai.local
  environment: dev

identity:
  enabled: true
  replicaCount: 1
  image:
    tag: "dev"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
  ingress:
    enabled: true
    host: identity.dev.testing-ai.local

organization:
  enabled: true
  replicaCount: 1
  image:
    tag: "dev"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
