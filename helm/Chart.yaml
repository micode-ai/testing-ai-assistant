apiVersion: v2
name: testing-ai-assistant
description: Helm umbrella chart for the Testing AI Assistant platform
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: identity
    version: 0.1.0
    repository: "file://charts/identity"
    condition: identity.enabled
  - name: organization
    version: 0.1.0
    repository: "file://charts/organization"
    condition: organization.enabled
  - name: project
    version: 0.1.0
    repository: "file://charts/project"
    condition: project.enabled
  - name: pipeline
    version: 0.1.0
    repository: "file://charts/pipeline"
    condition: pipeline.enabled
  - name: ai
    version: 0.1.0
    repository: "file://charts/ai"
    condition: ai.enabled
  - name: notification
    version: 0.1.0
    repository: "file://charts/notification"
    condition: notification.enabled
  - name: test-runner
    version: 0.1.0
    repository: "file://charts/test-runner"
    condition: test-runner.enabled
  - name: dashboard
    version: 0.1.0
    repository: "file://charts/dashboard"
    condition: dashboard.enabled
  - name: infrastructure
    version: 0.1.0
    repository: "file://charts/infrastructure"
    condition: infrastructure.enabled
