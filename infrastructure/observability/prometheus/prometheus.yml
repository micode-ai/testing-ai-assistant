global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'identity-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels:
          service: identity

  - job_name: 'org-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3002']
        labels:
          service: org

  - job_name: 'project-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3003']
        labels:
          service: project

  - job_name: 'pipeline-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3004']
        labels:
          service: pipeline

  - job_name: 'ai-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3005']
        labels:
          service: ai

  - job_name: 'notification-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3006']
        labels:
          service: notification
